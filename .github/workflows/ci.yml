name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    name: test on node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.18', '22.13']
        include:
          # One Windows cell, because the line ending rules in .gitattributes
          # are only actually tested by a checkout that would break without
          # them.
          - os: windows-latest
            node: '22.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npm run coverage

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - name: the tool answers
        run: |
          node bin/kerf.js --version
          node bin/kerf.js sources
          node bin/kerf.js technique --joint J-118 --size 6 --schedule 40 \
            --activity 40 --distance 48 --standoff 6.625
      - name: a rejected weld exits one
        run: |
          set +e
          node bin/kerf.js judge --size 6 --schedule 40 CRACK:0.2:2
          test $? -eq 1
